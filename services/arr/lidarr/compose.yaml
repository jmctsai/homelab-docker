services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:nightly
    # image: blampe/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
      - DOCKER_MODS=ghcr.io/gilbn/theme.park:lidarr
      - TP_THEME=dracula
    volumes:
      # Keep local config local
      - ./config:/config

      # 1. Backups subpath from nfs_docker
      - type: volume
        source: nfs_docker
        target: /backups
        volume:
          subpath: lidarr/backups

      # 2. Downloads subpath from nfs_media
      - type: volume
        source: nfs_media
        target: /downloads
        volume:
          subpath: downloads

      # 3. Music subpath from nfs_media
      - type: volume
        source: nfs_media
        target: /music
        volume:
          subpath: music
    ports:
      - 8686:8686

  slskd:
    container_name: slskd
    image: slskd/slskd:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - SLSKD_REMOTE_CONFIGURATION=true
    ports:
      - "5030:5030"
      - "40300:50300"
      - "5031:5031"
    volumes:
      # Keep local config and app data local
      - ./slskd/app/:/app
      - ./slskd/config:/config

      # 1. Completed downloads subpath from nfs_media
      - type: volume
        source: nfs_media
        target: /downloads/soulseek
        volume:
          subpath: downloads/soulseek

      # 2. Incomplete downloads subpath from nfs_media
      - type: volume
        source: nfs_media
        target: /downloads/soulseek/incomplete
        volume:
          subpath: downloads/soulseek/incomplete
      # Remember: Add Remote Path Mapping in Lidarr Download Client:
      # Host           Remote Path      Local Path
      # 192.168.1.203  /app/downloads/  /downloads/soulseek/

volumes:
  # Pull the infrastructure shares you defined in your volumes stack
  nfs_docker:
    external: true
  nfs_media:
    external: true
