---
services:
  whisparr:
    image: ghcr.io/hotio/whisparr:v3
    container_name: whisparr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Vancouver
      - WEBUI_PORTS=6969/tcp
    volumes:
      - ./config:/config
      - /media/downloads:/downloads
      - /media/j/whisparr:/whisparr
    ports:
      - 6969:6969
    restart: unless-stopped
