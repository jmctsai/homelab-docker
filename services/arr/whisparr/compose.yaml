---
services:
  whisparr:
    image: ghcr.io/thespad/whisparr:latest
    container_name: whisparr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
    volumes:
      - ./config:/config
      - /media/downloads:/downloads
      - /media/j/whisparr:/whisparr
    ports:
      - 6969:6969
    restart: unless-stopped
