services:
  musicseerr:
    image: ghcr.io/habirabbu/musicseerr:latest
    container_name: musicseerr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - PORT=8688
      - TZ=America/Vancouver
    ports:
      - "8688:8688"
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache

      - type: volume
        source: nfs_media
        target: /music
        read_only: true
        volume:
          subpath: music

volumes:
  nfs_media:
    external: true
