services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: qbittorrent_gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ./gluetun-data:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      # OpenVPN
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - OPENVPN_CIPHERS=${OPENVPN_CIPHERS}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - SERVER_CITIES=${SERVER_CITIES}
      # Wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      # Timezone for accurate log times
      - TZ=America/Vancouver
      # Try fix
      - DNS=1.1.1.1,1.0.0.1
      - DNSSEC=off

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
      - WEBUI_PORT=8888
      # - DOCKER_MODS=ghcr.io/gilbn/theme.park:qbittorrent
      # - TP_THEME=dracula
    volumes:
      # Keep local config local
      - ./qbittorrent-config:/config

      # 1. Downloads subpath from nfs_media (was /media/downloads)
      - type: volume
        source: nfs_media
        target: /downloads
        volume:
          subpath: downloads

      # 2. Unsorted subpath from nfs_media (was /media/j/unsorted)
      - type: volume
        source: nfs_media
        target: /unsorted
        volume:
          subpath: j/unsorted

      - /etc/localtime:/etc/localtime:ro

volumes:
  nfs_media:
    external: true
