services:
  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:latest
    container_name: nzbhydra2
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
    volumes:
      # 1. Config subpath from nfs_docker (was /docker/nzbhydra2/conf)
      - type: volume
        source: nfs_docker
        target: /config
        volume:
          subpath: nzbhydra2/conf

      # 2. Downloads subpath from nfs_media (was /media/downloads)
      - type: volume
        source: nfs_media
        target: /downloads
        volume:
          subpath: downloads
    ports:
      - 5076:5076

volumes:
  nfs_docker:
    external: true
  nfs_media:
    external: true
