services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    # image: plexinc/pms-docker
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      # - VERSION=docker
      # - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./conf:/config
        #- /docker/plex/conf:/config

      # Shows subpath from nfs_media (was /media/shows)
      - type: volume
        source: nfs_media
        target: /shows
        volume:
          subpath: shows

      # Anime subpath from nfs_media (was /media/anime)
      - type: volume
        source: nfs_media
        target: /anime
        volume:
          subpath: anime

      # Movies subpath from nfs_media (was /media/movies)
      - type: volume
        source: nfs_media
        target: /movies
        volume:
          subpath: movies

      # Music subpath from nfs_media (was /media/music)
      - type: volume
        source: nfs_media
        target: /music
        volume:
          subpath: music

      # Music-yt subpath from nfs_media (was /media/music-yt)
      - type: volume
        source: nfs_media
        target: /music-yt
        volume:
          subpath: music-yt

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  nfs_media:
    external: true
