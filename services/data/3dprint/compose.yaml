services:
  spoolman:
    image: ghcr.io/donkie/spoolman:latest
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - type: bind
        source: ./data/spoolman
        target: /home/app/.local/share/spoolman
    ports:
      - "7912:8000"
    environment:
      - TZ=America/Vancouver

  filabridge:
    image: ghcr.io/sargonas/filabridge:latest
    user: "1000:1000"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
